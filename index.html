<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zachary Jenkins — Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Background grain overlay -->
  <div class="grain"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-name">
      <span class="name-first">Zachary</span>
      <span class="name-last">Jenkins</span>
    </div>
    <nav class="header-nav">
      <a href="#">Work</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Hero tagline -->
  <section class="hero">
    <p class="hero-tagline">Design that <em>clarifies</em>.</p>
  </section>

  <!-- Cards -->
  <main class="cards-container">

    <article class="card" data-index="0"
      data-title="Brand Identity"
      data-tag="Coming Soon"
      data-preview="Title"
      data-description="Placeholder text."
      data-link="404.html">
      <div class="card-inner">
        <div class="card-header">
          <span class="card-tag">Coming Soon</span>
          <h2 class="card-title">Title</h2>
        </div>
        <div class="card-preview-image">
          <div class="placeholder-graphic pg-1">
            <div class="pg-circle"></div>
            <div class="pg-line"></div>
            <div class="pg-line short"></div>
          </div>
        </div>
        <p class="card-preview-text">Placeholder text.</p>
      </div>
    </article>

    <article class="card card--featured" data-index="1"
      data-title="Craigslist Redesign"
      data-tag="UX / Visual Design"
      data-preview="Placeholder tagline."
      data-description="Placeholder description."
      data-link="project-craigslist.html">
      <div class="card-inner">
        <div class="card-header">
          <span class="card-tag">UX / Visual Design</span>
          <h2 class="card-title">Craigslist<br>Redesign</h2>
        </div>
        <div class="card-preview-image">
          <div class="placeholder-graphic pg-2">
            <div class="pg-bar tall"></div>
            <div class="pg-bar medium"></div>
            <div class="pg-bar short"></div>
            <div class="pg-bar medium"></div>
            <div class="pg-bar tall"></div>
          </div>
        </div>
        <p class="card-preview-text">Placeholder text.</p>
      </div>
    </article>

    <article class="card" data-index="2"
      data-title="Brand Identity"
      data-tag="Coming Soon"
      data-preview="Title"
      data-description="Placeholder text."
      data-link="404.html">
      <div class="card-inner">
        <div class="card-header">
          <span class="card-tag">Coming Soon</span>
          <h2 class="card-title">Title</h2>
        </div>
        <div class="card-preview-image">
          <div class="placeholder-graphic pg-3">
            <span class="pg-letter">Aa</span>
          </div>
        </div>
        <p class="card-preview-text">Placeholder text.</p>
      </div>
    </article>

  </main>

  <!-- Expanded Card Overlay -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="overlay-card" id="overlayCard">
      <button class="overlay-close" id="overlayClose" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <line x1="1" y1="1" x2="17" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="17" y1="1" x2="1" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="overlay-content">
        <span class="overlay-tag" id="overlayTag"></span>
        <h2 class="overlay-title" id="overlayTitle"></h2>
        <div class="overlay-image-area" id="overlayImage"></div>
        <p class="overlay-description" id="overlayDescription"></p>
        <a class="overlay-btn" id="overlayBtn" href="#">View Project →</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
